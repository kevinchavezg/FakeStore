<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FakeStore</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="encabezado">
        <div class="contenedorMenu">
            <nav>
                <ul class="menu">
                    <li><a href="#inicio"><img src="storage/img/inicio.png"></a></li>
                    <li><a href="views/checkout.html"><img src="storage/img/checkout.png"></a></li>
                    <li><a href="#inicio"><img src="storage/img/favMenu.png"></a></li>
                    <li><a href="views/sizesTable.html"><img src="storage/img/tallas.png"></a></li>
                </ul>
            </nav>
        </div>
        <div class="bienvenida" id="inicio">
            <h4>Hello, Welcome Back &#128075;</h4>
            <h2>Juan Carlos Mariño</h2>
        </div>
        <div class="usuario">
            <img src="storage/img/login.png">
        </div>
    </header>
    <main>
        <div class="contenedorFiltros">
            <section class="filtros">
                    <input type="text" placeholder="Search clothes...">
                    <button><img src="storage/img/filter.png"></button>

            <section class="categorias">
                <button class="all"><img src="storage/img/All.png">All Items</button>

                <button class="mens"><img src="storage/img/pants.png">Mens</button>
                <button class="jewelery"><img src="storage/img/shirt.png">Jewelery</button>
                <button class="electronics"><img src="storage/img/shirt.png">Electronics</button>

            </section>
        </div>
        <section class="catalogo" id="catalogo">
            
        </section>

        <footer>
            <h5>Autor: Kevin Chávez. 2026 Todos los derechos reservados.</h5>
        </footer>
    </main>
    <script src="./js/app.js"></script>

</html>
